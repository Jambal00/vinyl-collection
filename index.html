<style>

.sleeve{position:relative;aspect-ratio:1;border-radius:4px;overflow:hidden;background:var(--deck);box-shadow:var(--shadow)}

.tile b{font:700 16px/1.15 var(--display);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

.empty{text-align:center;padding:40px 16px;display:flex;flex-direction:column;gap:12px;align-items:center}

.list{display:flex;flex-direction:column;gap:10px}

.cand b{font:700 17px/1.15 var(--display);display:block}
.facts{display:flex;flex-wrap:wrap;gap:4px 6px;margin-top:4px}
.fact{font-size:12.5px;border:1px solid var(--line);border-radius:99px;padding:1px 8px;white-space:nowrap;color:var(--muted)}

.fact.claimed{background:var(--blue-soft);border-color:var(--blue);color:var(--blue);font-weight:700}
.fact.desire{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.fact.key{color:var(--ink);border-color:var(--ink);font-weight:600}
.src{font:700 10.5px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.notice{border-radius:10px;padding:12px 14px;font-size:14.5px}
.valuebar{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);border-radius:12px;padding:10px 14px}.valuebar>div{display:flex;flex-direction:column;gap:2px;min-width:0}.vtotal{font-size:22px;line-height:1.2}.up{color:#1d7a3a;font-size:13px}.down{color:#b3261e;font-size:13px}

.sheet{background:var(--bg);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + var(--bot));display:flex;flex-direction:column;gap:14px}

.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14.5px}

.side{display:flex;flex-direction:column;gap:2px}

.scanbox{position:relative;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:4/3}

.ruleRow span{font:700 18px var(--display);color:var(--muted);text-align:center}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
{
'use strict';
/* ---------- setup ---------- */
const SUPABASE_URL='https://brgtnbkazftmetedbyup.supabase.co';
const SUPABASE_KEY='sb_publishable_jrLTgVCk7bOdRWKftgI87Q_sBJAcYjJ';

const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

const S={user:null,records:LS.get('vc-records',[]),settings:LS.get('vc-settings',{shelf_rule:{order:['artist','year'],ignoreThe:true,variousSection:true},discogs_token:''}),queue:LS.get('vc-queue',[]),tab:LS.get('vc-tab','collection'),claimed:LS.get('vc-claimed',[]),filters:{q:'',genre:'',decade:'',sort:'artist'},wq:'',shelfQ:'',focusId:null};

/* ---------- storage & sync (works offline; queues writes) ---------- */
function persist(){LS.set('vc-records',S.records);LS.set('vc-settings',S.settings);LS.set('vc-queue',S.queue);renderSync()}
function renderSync(){const el=$('#sync');if(!S.user){el.classList.add('hidden');return}el.classList.remove('hidden');

const COLS=['id','status','title','artist','year','country','label','catno','barcode','format','genres','styles','cover_url','cover_alt_url','tracks','source','source_id','release_group_id','pressing_confirmed','any_pressing','gift_pick','condition_media','condition_sleeve','bought_where','price_paid','notes','compilation','created_at','desire','buy_url','discogs_match','discogs_release_id','discogs_master_id'];
function rowOf(r){const o={};COLS.forEach(k=>{if(r[k]!==undefined)o[k]=r[k]});if(o.price_paid==='')o.price_paid=null;return o}

let mbLast=0;
async function mb(path){
  const wait=mbLast+1100-Date.now();if(wait>0)await sleep(wait);mbLast=Date.now();
  const url='https://musicbrainz.org/ws/2/'+path+(path.includes('?')?'&':'?')+'fmt=json';
  let r;try{r=await fetch(url,{headers:{Accept:'application/json'}})}catch(e){throw new Error('offline')}
  if(r.status===503){await sleep(1500);mbLast=Date.now();r=await fetch(url,{headers:{Accept:'application/json'}})}
  if(!r.ok)throw new Error('MusicBrainz said '+r.status);
  return r.json();
}
async function dg(path){
  const t=S.settings.discogs_token;if(!t)return null;
  const url='https://api.discogs.com/'+path+(path.includes('?')?'&':'?')+'token='+encodeURIComponent(t);
  let r;try{r=await fetch(url)}catch(e){throw new Error('offline')}
  if(r.status===401)throw new Error('Discogs token was refused. Check it in Settings.');
  if(!r.ok)throw new Error('Discogs said '+r.status);
  return r.json();
}
const credit=ac=>(ac||[]).map(a=>(a.name||a.artist?.name||'')+(a.joinphrase||'')).join('').trim();
const dgName=n=>String(n||'').replace(/\s\(\d+\)$/,'').replace(/\*$/,'');

function mbCand(r){

    format:[...new Set((r.media||[]).map(m=>m.format).filter(Boolean))].join(' + ')||'',tracks:(r.media||[]).reduce((n,m)=>n+(m['track-count']||0),0),
    thumb:'https://coverartarchive.org/release/'+r.id+'/front-250',thumbAlt:rg.id?'https://coverartarchive.org/release-group/'+rg.id+'/front-250':'',
    compilation:(rg['secondary-types']||[]).some(t=>/compilation|soundtrack/i.test(t))||/^various artists$/i.test(credit(r['artist-credit']))}
}
function dgCand(r){

function barcodeVariants(code){const c=String(code).replace(/\D/g,'');const v=new Set([c]);if(c.length===12)v.add('0'+c);if(c.length===13&&c[0]==='0')v.add(c.slice(1));return [...v].filter(Boolean)}
async function searchBarcode(code){

async function searchText(artist,title){

function fmtLen(ms){if(!ms)return '';const s=Math.round(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}

    genres:(r.genres||[]).slice(0,3),styles:(r.styles||[]).slice(0,4),tracks,source:'discogs',source_id:String(r.id),release_group_id:r.master_id?String(r.master_id):null,
    cover_url:img?.uri||c.thumb||null,cover_alt_url:null,compilation:(r.formats||[]).some(f=>(f.descriptions||[]).some(d=>/compilation/i.test(d)))||/^various$/i.test(artist)};

/* ---------- covers for records added without a lookup (e.g. imported lists) ----------
   Matches loosely: ignores words like "Vol", "Remastered" and "Anniversary", reads Roman numerals as numbers,
   and accepts initials ("SRV & DT" = Stevie Ray Vaughan & Double Trouble, "BB" = B.B.). A record is only
   marked as tried after MusicBrainz actually answered, so a busy moment doesn't leave it coverless. */
const ROMAN={i:'1',ii:'2',iii:'3',iv:'4',v:'5',vi:'6',vii:'7',viii:'8',ix:'9',x:'10'};
const NOISE=new Set(['the','a','an','of','and','vol','volume','volumes','remastered','remaster','anniversary','edition','deluxe','expanded','lp','vinyl','album','record','reissue','super']);
const toks=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/&/g,' and ').split(/[^a-z0-9]+/).filter(Boolean).map(t=>ROMAN[t]||t);
function tokScore(want,have){
  const w=toks(want).filter(t=>!NOISE.has(t)),h=toks(have);if(!w.length)return 0;
  const hs=new Set(h);const initials=h.map(t=>t[0]).join('');const joined=h.join('');
  return w.filter(t=>hs.has(t)||(t.length>1&&initials.includes(t))||(t.length>2&&joined.includes(t))).length/w.length;
}
const ALIASES={'white album':'The Beatles'};
async function findCover(artist,title){
  const lucene=a=>[...new Set(a)].filter(t=>/^[a-z0-9]+$/.test(t)).join(' OR ');
  const tw=toks(ALIASES[String(title).toLowerCase().replace(/^the\s+/,'').trim()]||title).filter(t=>!NOISE.has(t));
  const aw=toks(artist);const aj=aw.join('');
  if(!tw.length)return {hit:null,answered:true};
  const q='releasegroup:('+lucene(tw)+')'+(aw.length?' AND artist:('+lucene([...aw.filter(t=>!NOISE.has(t)||aw.length===1),aj])+')':'');
  let j;try{j=await mb('release-group/?query='+encodeURIComponent(q)+'&limit=25')}catch(e){return {hit:null,answered:false}}
  const wantTitle=ALIASES[String(title).toLowerCase().replace(/^the\s+/,'').trim()]||title;
  const ranked=(j['release-groups']||[]).map(g=>({g,t:tokScore(wantTitle,g.title),a:tokScore(artist,credit(g['artist-credit'])),r:tokScore(g.title,wantTitle)}))
    .filter(x=>x.t>=0.6&&x.a>=0.5&&x.g['primary-type']!=='Single')
    .sort((x,y)=>(y.t+y.a+0.5*y.r)-(x.t+x.a+0.5*x.r)||((y.g['primary-type']==='Album')-(x.g['primary-type']==='Album'))||(y.g.score||0)-(x.g.score||0));
  return {hit:ranked[0]?ranked[0].g:null,answered:true};
}
let enriching=false;
async function enrichCovers(){
  if(enriching||!navigator.onLine)return;enriching=true;
  const tried=LS.get('vc-enrich-tried-v2',{});

    for(const r of S.records.filter(x=>!x.cover_url&&!x.source_id&&!tried[x.id]&&x.title)){
      const {hit,answered}=await findCover(r.artist,r.title);
      if(!answered)break;            // MusicBrainz busy or offline: stop and try again next time
      tried[r.id]=1;LS.set('vc-enrich-tried-v2',tried);
      if(!hit)continue;
      const cur=S.records.find(x=>x.id===r.id);if(!cur||cur.cover_url)continue;
      saveRecord(Object.assign({},cur,{cover_url:'https://coverartarchive.org/release-group/'+hit.id+'/front-500',cover_alt_url:null,release_group_id:hit.id,year:cur.year||parseInt((hit['first-release-date']||'').slice(0,4))||null,compilation:cur.compilation||(hit['secondary-types']||[]).some(t=>/compilation|soundtrack/i.test(t))}));
      if(['wishlist','collection'].includes(S.tab)&&!sheetRoot.firstChild)render();
    }
  }finally{enriching=false}
}

/* ---------- shelf order ---------- */
const KEYS={artist:'Artist',genre:'Genre',decade:'Era (decade)',year:'Year',title:'Title',label:'Label'};
const VARIOUS='Soundtracks & compilations';
function artistKey(a,rule){let s=String(a||'').trim().toLowerCase();if(rule.ignoreThe)s=s.replace(/^(the|a|an)\s+/,'');return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
const decadeOf=r=>r.year?Math.floor(r.year/10)*10+'s':'Unknown era';
function sortParts(r,rule){
  const various=rule.variousSection&&r.compilation;
  const parts=[various?1:0];
  for(const k of rule.order){
    if(k==='artist')parts.push(various?'':artistKey(r.artist,rule));
    else if(k==='genre')parts.push(various?'':((r.genres||[])[0]||'zzzz unsorted').toLowerCase());
    else if(k==='decade')parts.push(r.year?String(Math.floor(r.year/10)*10):'9999');
    else if(k==='year')parts.push(r.year?String(r.year):'9999');
    else if(k==='title')parts.push(String(r.title||'').toLowerCase().replace(/^(the|a|an)\s+/,''));
    else if(k==='label')parts.push(String(r.label||'').toLowerCase());
  }
  parts.push(String(r.title||'').toLowerCase());parts.push(r.id||'');
  return parts;
}
function cmpParts(a,b){for(let i=0;i<a.length;i++){if(a[i]===b[i])continue;if(typeof a[i]==='number')return a[i]-b[i];return String(a[i]).localeCompare(String(b[i]),undefined,{numeric:true})}return 0}
function sectionOf(r,rule){
  if(rule.variousSection&&r.compilation)return VARIOUS;
  const k=rule.order[0];
  if(k==='genre')return (r.genres||[])[0]||'Unsorted';
  if(k==='decade')return decadeOf(r);
  if(k==='label')return r.label||'No label';
  if(k==='artist'){const c=artistKey(r.artist,rule).charAt(0).toUpperCase();return /[A-Z]/.test(c)?c:'#'}
  if(k==='title'){const c=String(r.title||'').replace(/^(the|a|an)\s+/i,'').charAt(0).toUpperCase();return /[A-Z]/.test(c)?c:'#'}
  return decadeOf(r);
}
function shelf(){const rule=S.settings.shelf_rule;return S.records.filter(r=>r.status==='owned').map(r=>({r,p:sortParts(r,rule)})).sort((a,b)=>cmpParts(a.p,b.p)).map(x=>x.r)}
function spotOf(id){
  const list=shelf();const i=list.findIndex(r=>r.id===id);if(i<0)return null;
  const rule=S.settings.shelf_rule;const sec=sectionOf(list[i],rule);
  const inSec=list.filter(r=>sectionOf(r,rule)===sec);
  return {pos:i+1,total:list.length,section:sec,secPos:inSec.findIndex(r=>r.id===id)+1,secTotal:inSec.length,before:list[i-1]||null,after:list[i+1]||null};
}
function ruleText(rule){return rule.order.map(k=>KEYS[k]).join(' → ')+(rule.ignoreThe?' · ignoring “The”':'')+(rule.variousSection?' · '+VARIOUS.toLowerCase()+' at the end':'')}

/* ---------- value (Discogs) ----------
   The vc-values edge function matches each record to Discogs and stores its value on the record, plus a
   history row in vc_values. Owned: Discogs' suggested price for the record's grade, else lowest listed.
   Wanted: lowest listed price. It also runs daily on a schedule and refreshes anything older than 30 days. */
const money=v=>v==null||v===''?'':'$'+Number(v).toLocaleString('en-US',{minimumFractionDigits:Number(v)%1?2:0,maximumFractionDigits:2});
const shortDate=d=>d?new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:new Date(d).getFullYear()!==new Date().getFullYear()?'numeric':undefined}):'';
function valueSummary(){const owned=S.records.filter(r=>r.status==='owned'),val=owned.filter(r=>r.value_amount!=null);
  const dates=owned.map(r=>r.value_checked_at).filter(Boolean).sort();
  return {owned:owned.length,valued:val.length,total:val.reduce((t,r)=>t+Number(r.value_amount),0),paid:owned.reduce((t,r)=>t+(r.price_paid!=null&&r.price_paid!==''?Number(r.price_paid):0),0),last:dates[dates.length-1]||null,checked:dates.length}}
function valueTrend(r){if(r.value_prev==null||r.value_amount==null)return '';const d=Number(r.value_amount)-Number(r.value_prev);if(Math.abs(d)<0.5)return '';return ' <span class="'+(d>0?'up':'down')+'">'+(d>0?'▲ ':'▼ ')+money(Math.abs(d))+'</span>'}
function discogsUrl(r){return r.discogs_release_id&&r.discogs_match==='release'?'https://www.discogs.com/release/'+r.discogs_release_id:r.discogs_master_id?'https://www.discogs.com/master/'+r.discogs_master_id:r.discogs_release_id?'https://www.discogs.com/release/'+r.discogs_release_id:''}
function valueHTML(r){
  if(!r.value_checked_at)return '';
  if(r.discogs_match==='none')return '<dt>Value</dt><dd class="muted">Not found on Discogs</dd>';
  const owned=r.status==='owned';
  const main=r.value_amount!=null?(owned?'<b>'+money(r.value_amount)+'</b>':'From <b>'+money(r.value_amount)+'</b>')+valueTrend(r):'<span class="muted">None for sale right now</span>';
  const bits=[esc(r.value_basis||'')];if(r.value_for_sale!=null)bits.push(r.value_for_sale+' for sale');bits.push('checked '+shortDate(r.value_checked_at));
  const u=discogsUrl(r);
  return '<dt>'+(owned?'Value':'Price')+'</dt><dd>'+main+'<div class="small muted">'+bits.join(' · ')+(u?' · <a href="'+esc(u)+'" target="_blank" rel="noopener">Discogs ↗</a>':'')+'</div></dd>';
}
async function testDiscogsToken(t){try{const r=await fetch('https://api.discogs.com/oauth/identity?token='+encodeURIComponent(t));if(r.status===401||r.status===403)return {ok:false,reason:'bad'};if(!r.ok)return {ok:false,reason:'net'};const j=await r.json();return {ok:true,user:j.username||''}}catch(e){return {ok:false,reason:'net'}}}
let valueRun=null;
async function checkValues(ids,opt={}){
  if(valueRun){toast('Already checking values…');return}
  if(!S.settings.discogs_token){toast('Values come from Discogs. Add your free Discogs token in Settings first.',6000);openSettings();return}
  if(!navigator.onLine){toast('You’re offline. Check values when you’re back online.');return}
  if(!S.user){toast('Sign in first.');return}
  await flush();
  const list=(ids||S.records.map(r=>r.id)).slice();const total=list.length;let done=0,found=0,fails=0;
  valueRun={done:0,total};renderValueProgress();
  try{
    while(list.length){
      const batch=list.splice(0,4);
      const {data:{session}}=await sb.auth.getSession();
      const res=await fetch(SUPABASE_URL+'/functions/v1/vc-values',{method:'POST',headers:{'Content-Type':'application/json',apikey:SUPABASE_KEY,Authorization:'Bearer '+(session?session.access_token:'')},body:JSON.stringify({ids:batch})});
      const j=await res.json().catch(()=>({ok:false,reason:'busy'}));
      if(!j.ok){if(j.reason==='token'||j.reason==='token-bad'){toast('Discogs didn’t accept the token. Check it in Settings.',6000)}else toast('Couldn’t check values right now. Try again in a bit.');break}
      (j.done||[]).forEach(v=>{if(v.error){fails++;return}const i=S.records.findIndex(x=>x.id===v.id);if(i>=0){const {id,...rest}=v;S.records[i]={...S.records[i],...rest};if(v.value_amount!=null)found++}});

/* ---------- barcode scanning ---------- */
let scan=null;
function stopScan(){if(!scan)return;try{scan.stop()}catch(e){}scan=null}
function loadZXing(){return new Promise((res,rej)=>{if(window.ZXing)return res(window.ZXing);const s=document.createElement('script');s.src='https://unpkg.com/@zxing/library@0.20.0/umd/index.min.js';s.onload=()=>res(window.ZXing);s.onerror=()=>rej(new Error('Could not load the scanner'));document.head.appendChild(s)})}
async function startScan(video,onCode){
  stopScan();
  if('BarcodeDetector' in window){
    try{
      const det=new BarcodeDetector({formats:['ean_13','upc_a','upc_e','ean_8']});
      const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});
      video.srcObject=stream;video.setAttribute('playsinline','');await video.play();
      let alive=true;scan={stop(){alive=false;stream.getTracks().forEach(t=>t.stop())}};
      (async function loop(){while(alive){try{const codes=await det.detect(video);if(codes.length){const v=codes[0].rawValue;stopScan();onCode(v);return}}catch(e){}await sleep(250)}})();
      return;
    }catch(e){if(e.name==='NotAllowedError')throw new Error('Camera permission was turned down. You can type the barcode instead.')}
  }
  const ZX=await loadZXing();
  const hints=new Map();hints.set(ZX.DecodeHintType.POSSIBLE_FORMATS,[ZX.BarcodeFormat.EAN_13,ZX.BarcodeFormat.UPC_A,ZX.BarcodeFormat.UPC_E,ZX.BarcodeFormat.EAN_8]);
  const reader=new ZX.BrowserMultiFormatReader(hints);
  video.setAttribute('playsinline','');
  scan={stop(){reader.reset()}};
  await reader.decodeFromConstraints({video:{facingMode:'environment'},audio:false},video,(result)=>{if(result){const v=result.getText();stopScan();onCode(v)}});
}
async function decodePhoto(file){
  if('BarcodeDetector' in window){try{const det=new BarcodeDetector({formats:['ean_13','upc_a','upc_e','ean_8']});const bmp=await createImageBitmap(file);const c=await det.detect(bmp);if(c.length)return c[0].rawValue}catch(e){}}
  const ZX=await loadZXing();const reader=new ZX.BrowserMultiFormatReader();const url=URL.createObjectURL(file);
  try{const r=await reader.decodeFromImageUrl(url);return r.getText()}catch(e){return null}finally{URL.revokeObjectURL(url)}
}

function openAddFlow(opts){

    }};
  sh.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>setMode(b.dataset.m));

  const busy=t=>{results.innerHTML='<div class="row"><span class="spinner"></span>'+esc(t)+'</div>'};
  async function lookupBarcode(code){
    stopScan();const local=findByBarcode(code).filter(r=>!o.fix||r.id!==o.fix.id);

  }
  async function lookupText(a,t){busy('Searching for '+[a,t].filter(Boolean).join(' — ')+'…');const {cands,errs}=await searchText(a,t);showCands(cands,errs,{a,t})}
  let vinylOnly=true,country='';
  function showCands(cands,errs,ctx){
    const off=errs.some(e=>e==='offline');

          (safeUrl(sourceLink({source:c.source,source_id:c.id}))?'<a class="small" target="_blank" rel="noopener" href="'+esc(sourceLink({source:c.source,source_id:c.id}))+'">Full pressing details ↗</a>':'')+'</div>').join('')+'</div>'+
        (o.mode==='owned'?'<button class="btn dark block" id="mostRecent">None of these match mine: use the most recent pressing</button><p class="small muted" style="margin-top:-6px">Takes the cover and songs from the newest pressing of this album and saves it with your barcode or catalog code.</p>':'')+

        '<button class="btn ghost block" id="toManual2">None of these, add it by hand</button>';
      const vo=results.querySelector('#vo');if(vo)vo.onchange=e=>{vinylOnly=e.target.checked;draw()};
      const cy=results.querySelector('#cty');if(cy)cy.onchange=e=>{country=e.target.value;draw()};
      results.querySelectorAll('.cand').forEach(b=>b.onclick=()=>pick(cands[+b.dataset.i],true));

  /* None of the catalog pressings match: take the album's newest pressing for cover + songs, then the user's own code. */

/* ---------- new release check ----------
   The page carries its release marker (meta vc-version). While the app is open it quietly fetches a fresh
   copy of the page now and then, and whenever it comes back into view; if that copy's marker differs, a pill
   offers to load it. Nothing changes until Pete taps it. Same pattern as Bowling Bro'. */
const APP_VERSION=(document.querySelector('meta[name="vc-version"]')||{}).content||'';
let updateSeen=false,swReg=null;
function checkForUpdate(){
  if(updateSeen||!APP_VERSION||!/^https?:$/.test(location.protocol)||!navigator.onLine)return;
  fetch(location.pathname+'?vcheck='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.text():'').then(t=>{
    const m=t.match(/<meta name="vc-version" content="([^"]+)"/);
    if(m&&m[1]!==APP_VERSION){updateSeen=true;$('#update-pill').classList.remove('hidden')}
  },()=>{});
  if(swReg)swReg.update().catch(()=>{});
}
$('#update-pill').addEventListener('click',async()=>{
  const b=$('#update-pill');b.disabled=true;b.textContent='Updating…';
  await flush().catch(()=>{});
  try{const keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith('vc-shell')).map(k=>caches.delete(k)))}catch(e){}
  location.replace(location.pathname+'?v='+Date.now());   // a fresh address, so no cached copy is used
});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkForUpdate()});
setTimeout(checkForUpdate,4000);
setInterval(checkForUpdate,3*60*1000);

  body.querySelectorAll('[data-send]').forEach(b=>b.onclick=async()=>{const url=linkUrl(b.dataset.send);const whos=S.settings.display_name?possessive(S.settings.display_name):'my';
    if(navigator.share){try{await navigator.share({title:'Vinyl list',text:'Here’s '+whos+' vinyl list:',url})}catch(e){}}
    else{try{await navigator.clipboard.writeText(url);toast('Link copied')}catch(e){toast('Press and hold the link to copy it')}}});
}

/* ---------- gift page (family & friends; no sign-in) ---------- */
const G={data:null,tab:'wish',q:''};
const giftSecrets=()=>LS.get('vc-gift-secrets',{});
const possessive=n=>n?(/s$/i.test(n)?n+'’':n+'’s'):'';
async function renderGift(refresh){
  $('#tabs').classList.add('hidden');$('#btnSettings').classList.add('hidden');$('#sync').classList.add('hidden');
  if(!sb){view.innerHTML='<div class="notice err">Can’t reach the list right now. Check your connection and try again.</div>';return}
  if(!G.data||refresh){
    if(!G.data)view.innerHTML='<div class="row" style="justify-content:center;padding:40px"><span class="spinner"></span>Loading…</div>';
    const {data,error}=await sb.rpc('vc_gift_list',{p_token:GIFT_TOKEN});
    if(error){if(!G.data){view.innerHTML='<div class="notice err">Couldn’t load the list. <button class="btn small" id="rt">Try again</button></div>';$('#rt').onclick=()=>renderGift(true)}return}
    G.data=data;
  }
  const d=G.data;
  if(!d||!d.ok){view.innerHTML='<div class="empty"><div class="bigdisc"></div><h2>This link isn’t active anymore</h2><p class="muted">Ask for a fresh link.</p></div>';return}
  const who=d.name||'';const whos=possessive(who);
  document.title=(whos?whos+' ':'')+(d.kind==='friends'?'records':'vinyl wish list');
  if(d.kind==='friends'){showOwned(whos?whos+' record collection':'Record collection','');return}
  if(d.kind==='insiders'&&G.tab==='owned'){showOwned('Already in '+(whos?whos+' ':'the ')+'collection',segHTML(d));return}
  const wish=d.wanted||[];const sec=giftSecrets();
  const open=wish.filter(w=>!w.claimer_name),taken=wish.filter(w=>w.claimer_name);
  const card=w=>{const mine=!!sec[w.id];const buy=safeUrl(w.buy_url)?'<a class="btn small" href="'+esc(w.buy_url)+'" target="_blank" rel="noopener">Buy ↗</a>':'';
    return '<div class="store-item">'+sleeve(w)+'<div class="stack" style="gap:6px"><div><b>'+esc(w.title)+'</b><span class="muted">'+esc(w.artist)+'</span></div>'+
      '<div class="small facts" style="margin:0">'+(w.desire?'<span class="fact desire">Wants it '+esc(w.desire)+'/10</span>':'')+(w.any_pressing?'<span class="fact">Any version is fine</span>':(w.catno?'<span class="fact key">'+esc(w.catno)+'</span>':''))+'</div>'+
      (w.claimer_name
        ?(mine?'<div class="notice ok" style="padding:8px 10px"><b>You’re getting this.</b></div><div class="row">'+buy+'<button class="btn small ghost" data-undo="'+esc(w.id)+'">Undo</button></div>'
              :'<div class="notice info" style="padding:8px 10px"><b>'+esc(w.claimer_name)+'</b> is getting this.</div>')
        :'<div class="row"><button class="btn small primary" data-claim="'+esc(w.id)+'">🎁 I’m getting this</button>'+buy+'</div>')+
      '</div></div>'};
  view.innerHTML='<div class="stack">'+segHTML(d)+
    '<div class="stack" style="gap:6px"><h2>'+esc(whos?whos+' vinyl wish list':'Vinyl wish list')+'</h2><p class="muted">The records '+esc(who||'they')+' want'+(who?'s':'')+' most right now, best first. Tap <b>I’m getting this</b> so nobody doubles up. '+esc(who||'They')+' won’t see who.</p></div>'+
    (open.length?'<div class="list">'+open.map(card).join('')+'</div>':'<div class="notice ok">Everything on the list is spoken for. Nice work!</div>')+
    (taken.length?'<h3 style="margin-top:8px">Already spoken for</h3><div class="list">'+taken.map(card).join('')+'</div>':'')+'</div>';
  bindSeg();
  view.querySelectorAll('[data-claim]').forEach(b=>b.onclick=()=>claimGift(b.dataset.claim));
  view.querySelectorAll('[data-undo]').forEach(b=>b.onclick=()=>undoGift(b.dataset.undo));
}
function segHTML(d){return d.kind==='insiders'?'<div class="seg" role="group" aria-label="Show"><button data-gt="wish" aria-pressed="'+(G.tab==='wish')+'">Wish list</button><button data-gt="owned" aria-pressed="'+(G.tab==='owned')+'">Already has ('+(d.owned||[]).length+')</button></div>':''}
function bindSeg(){view.querySelectorAll('[data-gt]').forEach(b=>b.onclick=()=>{G.tab=b.dataset.gt;G.q='';renderGift();$('#scroller').scrollTop=0})}
function showOwned(title,seg){
  const list=G.data.owned||[];
  view.innerHTML='<div class="stack">'+seg+'<div class="row" style="justify-content:space-between;align-items:baseline"><h2>'+esc(title)+'</h2><span class="muted count">'+list.length+' records</span></div><input type="search" id="gq" placeholder="Search artist or title" value="'+esc(G.q)+'" aria-label="Search records"><div id="ownedGrid"></div></div>';
  const draw=()=>{const q=G.q.toLowerCase();const l=list.filter(r=>!q||(r.title+' '+r.artist).toLowerCase().includes(q));
    $('#ownedGrid').innerHTML=l.length?'<div class="covers">'+l.map(r=>'<div class="tile" style="cursor:default">'+sleeve(r)+'<b>'+esc(r.title)+'</b><span>'+esc(r.artist)+(r.year?' · '+esc(r.year):'')+'</span></div>').join('')+'</div>':'<p class="muted">Nothing matches.</p>'};
  draw();$('#gq').oninput=e=>{G.q=e.target.value;draw()};bindSeg();
}
function claimGift(id){
  const w=(G.data.wanted||[]).find(x=>x.id===id);if(!w)return;
  const sh=openSheet('<div class="sheet-head"><h2>Getting “'+esc(w.title)+'”</h2><button class="iconbtn" id="x" aria-label="Close">✕</button></div><p>Your name shows to the rest of the family so nobody else buys it. '+esc(G.data.name||'They')+' won’t see it.</p>'+
    '<form id="fClaim" class="stack"><label class="f">Your name<input type="text" id="gn" required maxlength="60" autocomplete="given-name" value="'+esc(LS.get('vc-giver-name',''))+'" autofocus></label><button class="btn primary block">🎁 I’m getting this</button></form>');
  sh.querySelector('#x').onclick=closeSheet;
  sh.querySelector('#fClaim').onsubmit=async e=>{e.preventDefault();const name=sh.querySelector('#gn').value.trim();if(!name)return;LS.set('vc-giver-name',name);
    const btn=sh.querySelector('button.primary');btn.disabled=true;btn.textContent='Saving…';
    const {data,error}=await sb.rpc('vc_gift_claim',{p_token:GIFT_TOKEN,p_record:id,p_name:name});
    closeSheet();
    if(error||!data){toast('Couldn’t save that. Check your connection and try again.');return}
    if(data.ok){const s=giftSecrets();s[id]=data.secret;LS.set('vc-gift-secrets',s);toast('<b>It’s yours.</b> Everyone else will see you’re getting it.',6000)}
    else if(data.reason==='taken')toast('<b>'+esc(data.name)+'</b> just claimed that one.');
    else if(data.reason==='gone')toast('That record isn’t on the list anymore.');
    else toast('This link isn’t active anymore.');
    renderGift(true);
  };
}
async function undoGift(id){
  const s=giftSecrets();if(!s[id])return;
  const {data,error}=await sb.rpc('vc_gift_unclaim',{p_token:GIFT_TOKEN,p_record:id,p_secret:s[id]});
  if(error){toast('Couldn’t undo that. Check your connection and try again.');return}
  delete s[id];LS.set('vc-gift-secrets',s);toast(data&&data.ok?'Okay, it’s back on the list.':'That claim was already gone.');renderGift(true);
}

/* ---------- start ---------- */
(async function init(){
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').then(r=>{swReg=r}).catch(()=>{});
  if(GIFT_TOKEN){renderGift();document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')renderGift(true)});return}
  if(!sb){S.user=LS.get('vc-user',null);render();return}
  const {data}=await sb.auth.getSession();
  S.user=data.session?.user||LS.get('vc-user',null);
  sb.auth.onAuthStateChange((ev,session)=>{if(session?.user){S.user=session.user;LS.set('vc-user',{id:session.user.id,email:session.user.email})}});
  if(S.user)LS.set('vc-user',{id:S.user.id,email:S.user.email});
  render();
  if(S.user)pull();
})();
}
</script>
</body>
</html>
